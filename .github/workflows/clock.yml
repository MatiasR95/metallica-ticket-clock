# Logs Metallica-at-Sphere resale prices and official package status every 30 minutes.
# Public repo: standard GitHub-hosted runners are free here, so this doesn't touch the 2000-minute pool.
# One trigger only. A run takes about a minute.
name: ticket clock

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clock
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Last show is Sat Feb 6 2027. The Claude refresh task disables this workflow on Feb 8 (gh workflow disable).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # TicketSmarter (sections, 2-day passes) and SUPER. TrackaLacker and Vibee refuse GitHub's servers;
      # Matías' laptop adds those to data/tl/ when it's on (laptop.mjs).
      - name: Collect prices and package status
        run: node watch.mjs --part cloud
      - name: Build CSVs
        run: node build.mjs
      - name: Commit data
        run: |
          git config user.name 'ticket-clock'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          # The laptop pushes to other files; on a race, rebase over it and try again.
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1
